kind = "data-app"
previewPath = "/"
title = "PipelineInsights"
description = "A dense analyst dashboard for exploring sport-agnostic player-prop predictions, market edges, model agreement, and pipeline freshness. Tennis is active first, with MLB and NFL visible as future sports."
version = "1.0.0"
id = "artifacts/pipelineinsights"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22424

[services.development]
run = "pnpm --filter @workspace/pipelineinsights run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pipelineinsights", "run", "build" ]
serve = "static"
publicDir = "artifacts/pipelineinsights/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22424"
BASE_PATH = "/"
